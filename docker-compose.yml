services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SUPPORT_URL: ${SUPPORT_URL:-}
      SUPPORT_TEXT: ${SUPPORT_TEXT:-Cảm ơn bạn đã đồng hành cùng Hội Vào Hang.}
      SPONSOR_NAME: ${SPONSOR_NAME:-}
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      target: web
    ports:
      - '8080:80'
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
